apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: Workspace
      name: workspace-template
    patch: |-
      - {op: add, path: /metadata/name, value: nkp-flux-provisioned-phvwv}
      - {op: add, path: /spec/namespaceName, value: nkp-flux-provisioned-phvwv-jjxpb}
      - {op: add, path: /metadata/annotations/kommander.mesosphere.io~1display-name, value: "Data Science Group"}
      - {op: add, path: /metadata/annotations/caren.nutanix.com~1namespace-sync, value: ""}
      - {op: add, path: /metadata/annotations/workspace.kommander.mesosphere.io~1allow-existing-namespace, value: "true"}
      - {op: add, path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune, value: disabled}